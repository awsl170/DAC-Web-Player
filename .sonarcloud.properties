sonar.projectKey=awsl170_DAC-Web-Player
sonar.projectName=DAC Web Player
sonar.projectVersion=1.2.0
sonar.sourceEncoding=UTF-8

# 这份文件是给 SonarCloud 的「Automatic Analysis」看的。
# 本项目没有 CI workflow（仓库里没有 .github/workflows），SonarCloud 用 GitHub App
# 自动分析每次 push；该模式下 **只读 .sonarcloud.properties，完全不读
# sonar-project.properties**，所以两边要各写一份、内容保持一致。
#
# 之前质量门不通过的原因就在这里：排除项只写在 sonar-project.properties 里，等于没生效，
# Sonar 把 prebuilt/ffmpeg/<abi>/share/ffmpeg/examples/*.c（FFmpeg 自带的演示程序，
# 三个 ABI 各一份，内容完全相同）当成了项目代码 → 重复率 10%+。
sonar.exclusions=prebuilt/**,**/prebuilt/**,lib/**,app/src/main/jniLibs/**,app/src/main/assets/**,app/build/**,**/build/**,.gradle/**,.kotlin/**,docs/**,LICENSES/**,tools/**,scripts/**,**/*.so,**/*.a,**/*.jar

# 重复率（CPD）度量也按同样的范围算。
sonar.cpd.exclusions=prebuilt/**,**/prebuilt/**,lib/**,app/src/main/jniLibs/**,app/src/main/assets/**,app/build/**,**/build/**,.gradle/**,.kotlin/**,docs/**,LICENSES/**,tools/**,scripts/**,**/*.so,**/*.a,**/*.jar

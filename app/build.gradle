plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 发布签名：keystore 与口令放在仓库外（E:\库\音乐播放器\keystore.properties），不进 git。
// 文件不存在时（比如别人 clone 下来）自动回退 debug 签名，保证照样能构建。
def keystorePropsFile = rootProject.file('../keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystorePropsFile.exists() && keystoreProps['storeFile']

android {
    namespace 'com.dacweb.player'
    compileSdk 35

    defaultConfig {
        applicationId "com.dacweb.player"
        minSdk 22
        targetSdk 35
        versionCode 6
        versionName "1.2.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 有正式 keystore 就用自己的签名；没有则回退 debug 签名，方便别人 clone 后直接构建
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug 包也用同一把正式 key 签名：这样 debug/release 可以互相覆盖安装，
            // 且 run-as 可用，方便用 adb 直接把插件 jar 推进私有目录。
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // SMB/FTP/SFTP 的 Java 库用到 java.util.Base64 等 API 26+ 的类，靠脱糖补到 minSdk 22
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
        // 插件接口（plugin.MusicPlugin）里的默认方法要生成真正的 Java default 方法，
        // 这样外部插件可以用纯 Java 实现，不必再写一遍 attach()/lyrics()。
        freeCompilerArgs += ['-Xjvm-default=all']
    }
    buildFeatures {
        viewBinding true
    }
    // 本机构建是 --offline，lintVital 需要的 lint-gradle 不在本地缓存里；
    // 关掉 release 的 vital lint（不影响编译与产物，正式发布前可在联网机器上单独跑 lint）
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    packagingOptions {
        // 保留第三方许可/声明文件（Apache-2.0 §4）；只丢弃构建噪音
        resources.excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/*.version',
                'META-INF/DEPENDENCIES',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/INDEX.LIST'
        ]
        resources.pickFirsts += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'io.coil-kt:coil:2.7.0'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-database:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // 网络文件服务器（SMB / FTP / SFTP 全部用成熟开源实现，不自己写协议）
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    implementation 'commons-net:commons-net:3.11.1'
    implementation 'com.github.mwiede:jsch:2.28.8'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

sonar.projectKey=awsl170_DAC-Web-Player
sonar.projectName=DAC Web Player
sonar.projectVersion=1.1.1

# ---------------------------------------------------------------------------
# 只把「业务代码」交给 Sonar 分析：Kotlin/Java 源码 + 示例插件（当测试看）
# 说明：本文件只能在没有命令行参数覆盖时生效。sonar-scanner 的 -D 参数与
# 本文件同名的属性时，**命令行优先**，文件里的值会被整个替换掉。
# 如果你在 CI 里已经传了 -Dsonar.cpd.exclusions=...，必须把那串参数也补上
# 下面这些模式（见文件末尾的注释示例），否则第三方代码会重新进入统计。
# ---------------------------------------------------------------------------
sonar.sources=app/src/main/java
sonar.tests=plugin-sample/src

sonar.sourceEncoding=UTF-8

# 第三方/生成物完全不参与分析（也就不参与重复率）：
#   prebuilt/**                预编译的 FFmpeg（头文件是上游代码，不是本项目写的）
#   app/src/main/jniLibs/**    各 ABI 的 .so
#   app/src/main/assets/**     许可证文本、更新日志等资源
#   app/build/**, build/**     Gradle 产物
#   docs/**, LICENSES/**, tools/**  文档、许可证正文、开发脚本
sonar.exclusions=\
  **/prebuilt/**,\
  **/app/src/main/jniLibs/**,\
  **/app/src/main/assets/**,\
  **/app/build/**,\
  **/build/**,\
  **/.gradle/**,\
  **/docs/**,\
  **/LICENSES/**,\
  **/tools/**,\
  **/*.so,\
  **/*.a

# 重复代码（CPD）度量同样排除上面这些目录。
# 注意：sonar.exclusions 已经把文件排除出分析，正常不会再算重复率；
# 这里再写一遍是为了防止只改了 cpd.exclusions（或被 CLI 覆盖后只剩一份）时漏掉。
sonar.cpd.exclusions=\
  **/prebuilt/**,\
  **/app/src/main/jniLibs/**,\
  **/app/src/main/assets/**,\
  **/app/build/**,\
  **/build/**,\
  **/docs/**,\
  **/LICENSES/**,\
  **/tools/**,\
  **/*.so,\
  **/*.a

# Kotlin 编译产物（AGP 输出），供 Sonar 解析字节码与类型信息
sonar.java.binaries=app/build/tmp/kotlin-classes/debug
sonar.java.libraries=app/build/intermediates/compile_and_runtime_not_namespaced_r_class_jar/debug/R.jar

# ---------------------------------------------------------------------------
# 命令行用法（会覆盖本文件里的同名属性，请把两边写一致）：
#
#   sonar-scanner \
#     -Dsonar.projectKey=awsl170_DAC-Web-Player \
#     -Dsonar.sources=app/src/main/java \
#     -Dsonar.tests=plugin-sample/src \
#     -Dsonar.java.binaries=app/build/tmp/kotlin-classes/debug \
#     -Dsonar.exclusions="**/prebuilt/**,**/app/src/main/jniLibs/**,**/app/src/main/assets/**,**/app/build/**,**/build/**,**/docs/**,**/LICENSES/**,**/tools/**,**/*.so,**/*.a" \
#     -Dsonar.cpd.exclusions="**/generated/**,**/proto/**,**/node_modules/**,**/target/**,**/prebuilt/**,**/app/src/main/jniLibs/**,**/app/src/main/assets/**,**/app/build/**,**/build/**,**/docs/**,**/LICENSES/**,**/tools/**,**/*.so,**/*.a"
# ---------------------------------------------------------------------------

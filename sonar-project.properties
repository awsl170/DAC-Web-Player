sonar.projectKey=awsl170_DAC-Web-Player
sonar.projectName=DAC Web Player
sonar.projectVersion=1.2.0
sonar.sourceEncoding=UTF-8

# 只把「业务代码」交给 Sonar 分析（Kotlin/Java 源码 + 示例插件当测试看）。
# 注意：sonar-scanner 的 -D 参数与这里同名的属性会**整个覆盖**本文件的该项，
# 在 CI 里传了 -Dsonar.cpd.exclusions=... 时，本文件那行就不生效了，
# 必须把下面的模式并列写进命令行（见文件末尾的命令示例）。
sonar.sources=app/src/main/java
sonar.tests=plugin-sample/src

# 第三方 / 生成物：不参与分析，也就不参与重复率统计
#   prebuilt/**              预编译 FFmpeg（头文件是上游代码，不是本项目写的）
#   app/src/main/jniLibs/**  各 ABI 的 .so
#   app/src/main/assets/**   许可证正文、更新日志等资源
#   app/build/**、build/**   Gradle 产物
#   docs/**、LICENSES/**、tools/**  文档、许可证原文、开发脚本
sonar.exclusions=**/prebuilt/**,**/app/src/main/jniLibs/**,**/app/src/main/assets/**,**/app/build/**,**/build/**,**/.gradle/**,**/docs/**,**/LICENSES/**,**/tools/**,**/*.so,**/*.a

# 重复代码（CPD）度量同样排除以上目录。
sonar.cpd.exclusions=**/generated/**,**/proto/**,**/node_modules/**,**/target/**,**/prebuilt/**,**/app/src/main/jniLibs/**,**/app/src/main/assets/**,**/app/build/**,**/build/**,**/docs/**,**/LICENSES/**,**/tools/**,**/*.so,**/*.a

# Kotlin 编译产物，供 Sonar 解析字节码与类型信息
sonar.java.binaries=app/build/tmp/kotlin-classes/debug

# ---------------------------------------------------------------------------
# 命令行用法（-D 优先于本文件，两边请保持一致）：
#
#   sonar-scanner \
#     -Dsonar.projectKey=awsl170_DAC-Web-Player \
#     -Dsonar.sources=app/src/main/java \
#     -Dsonar.tests=plugin-sample/src \
#     -Dsonar.java.binaries=app/build/tmp/kotlin-classes/debug \
#     -Dsonar.exclusions="**/prebuilt/**,**/app/src/main/jniLibs/**,**/app/src/main/assets/**,**/app/build/**,**/build/**,**/.gradle/**,**/docs/**,**/LICENSES/**,**/tools/**,**/*.so,**/*.a" \
#     -Dsonar.cpd.exclusions="**/generated/**,**/proto/**,**/node_modules/**,**/target/**,**/prebuilt/**,**/app/src/main/jniLibs/**,**/app/src/main/assets/**,**/app/build/**,**/build/**,**/docs/**,**/LICENSES/**,**/tools/**,**/*.so,**/*.a"
# ---------------------------------------------------------------------------
